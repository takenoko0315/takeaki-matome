<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>今日のまとめ</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#64748b}
  .msg{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;text-align:center;padding:12px;box-sizing:border-box}
  .msg a{color:#6366f1;font-weight:700;text-decoration:none;margin:0 6px}
  iframe{display:block;border:0;width:100%;height:100%}
</style>
</head>
<body>
<div class="msg" id="msg"><div>読み込み中…</div></div>
<script>
/*
 * 今日のまとめ（GitHub Pages 版）
 *
 * 中身はGoogle Apps Script（生活管理）が1時間ごとに作っておいたページです。
 * ここではそれを読み込んで表示するだけで、データはこのリポジトリには置きません。
 *
 * 使い方：URLの # の後ろに「s=アプリのID&k=合言葉」を付けて1回開く。
 *   https://takenoko0315.github.io/takeaki-matome/?mode=widget#s=…&k=…
 * 1回開けばこの端末に覚えるので、次からは # なしでも開けます。
 */
(function () {
  var STORE = 'takeaki-matome';
  var SITE_URL = 'https://sites.google.com/view/takeaki-matome';
  var msg = document.getElementById('msg');

  function readHash() {
    var out = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }
  function load() { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } }
  function save(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) {} }
  function fail(text) {
    msg.innerHTML = '<div>' + text + '<br><a href="' + location.href.replace(/#.*$/, '') + '">もう一度読み込む</a><a href="' + SITE_URL + '" target="_top">まとめを開く</a></div>';
  }

  var h = readHash();
  var conf = load();
  if (h.s && h.k) { conf = { s: h.s, k: h.k }; save(conf); }
  if (!conf.s || !conf.k) { fail('設定がありません。#s=…&k=… 付きのURLで1回開いてください。'); return; }

  var mode = new URLSearchParams(location.search).get('mode') === 'widget' ? 'widget' : 'page';
  var url = 'https://script.google.com/macros/s/' + encodeURIComponent(conf.s) + '/exec?format=raw&k=' + encodeURIComponent(conf.k) + '&t=' + Date.now();

  fetch(url, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      if (html.indexOf('/*DATA*/') === -1 && html.indexOf('const DATA') === -1) {
        throw new Error(html.trim() === 'NG' ? '合言葉が違います' : 'データの形が違います');
      }
      // Apps Script の外で動かすための小さな代わり（モードの受け渡し、ボタンは表示だけ）
      var shim = '<script>window.google={script:{url:{getLocation:function(cb){cb({parameter:{mode:' + JSON.stringify(mode) + '}});}}}};<\/script>'
        + '<style>.rz .bt{display:none}</style>';
      html = html.replace('<script>', shim + '<script>');
      // 中身は枠（iframe）の中で動かす。タップしたリンクは画面全体で開く
      var f = document.createElement('iframe');
      f.setAttribute('sandbox', 'allow-scripts allow-top-navigation-by-user-activation allow-popups');
      f.srcdoc = html;
      document.body.innerHTML = '';
      document.body.appendChild(f);
      // 10分ごとに読み直す（ウィジェットを置きっぱなしでも新しくなるように）
      setTimeout(function () { location.reload(); }, 10 * 60 * 1000);
    })
    .catch(function (e) { fail('読み込めませんでした（' + e.message + '）'); });
})();
</script>
</body>
</html>
